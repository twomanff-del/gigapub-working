<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gigapub Ad Viewer - Lite</title>
  
  <style>
    /* ⚡ Pure CSS - ০% এক্সট্রা CPU/RAM */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; overflow: hidden; user-select: none; }
    
    .btn-reset { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; background: #dc2626; color: #ffffff; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 100; transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 10px rgba(220,38,38,0.3); }
    .btn-reset:active { background: #b91c1c; transform: scale(0.85); }

    .card { background: #0f172a; border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: center; }
    .space-y-6 > * + * { margin-top: 1.5rem; }
    
    .grid { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 0.75rem; }
    .stat-box { background: rgba(30, 41, 59, 0.5); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
    
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; }
    .text-blue-400 { color: #60a5fa; }
    .text-green-400 { color: #4ade80; }
    
    .text-\[10px\] { font-size: 10px; text-transform: uppercase; color: #9ca3af; }
    #status { font-size: 14px; font-weight: 500; height: 20px; color: #9ca3af; transition: color 0.1s; }

    .btn-main { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #22c55e, #15803d); font-weight: 800; font-size: 18px; box-shadow: 0 10px 25px rgba(34,197,94,0.3); transition: 0.1s; border: none; color: white; margin: 20px auto; cursor: pointer; display: block; }
    .btn-main:active { transform: scale(0.92); }
    
    .text-red-400 { color: #f87171 !important; }
  </style>
</head>
<body>

  <!-- গোল রিসেট বাটন (Instant Clear) -->
  <button onclick="instantReset()" class="btn-reset" title="Instant Reset">🔄</button>

  <div class="card space-y-6">
    <div class="grid">
      <div class="stat-box">
        <div class="text-xl text-green-400" id="adCount">0</div>
        <div class="text-[10px]">Ad Counter</div>
      </div>
    </div>

    <p id="status">Checking SDK...</p>

    <button id="watchBtn" class="btn-main">WATCH AD</button>
  </div>

  <!-- Gigapub Ad Script (স্থায়ীভাবে থাকবে, যাতে অ্যাড আসা বন্ধ না হয়) -->
  <script src="https://ad.gigapub.tech/script?id=8402" async></script>

  <script>
    let adCount = parseInt(localStorage.getItem('tg_adCount')) || 0;
    let checkSDKInterval = null;
    let sdkCheckCount = 0;

    const statusEl = document.getElementById('status');

    function updateUI() {
      document.getElementById('adCount').innerText = adCount;
      localStorage.setItem('tg_adCount', adCount);
    }

    // 🚀 INSTANT Reset Logic (No Reload, No Script Removing)
    function instantReset() {
      // ১. সাথে সাথে জিরো করে দেওয়া হলো (Direct Clear)
      adCount = 0;
      localStorage.clear();
      updateUI();

      // ২. ইনস্ট্যান্ট স্ট্যাটাস আপডেট 
      statusEl.innerText = "Data Cleared! Ready.";
      statusEl.style.color = "#4ade80"; // Green
    }

    // --- Gigapub Integration ---
    async function showTgAd() {
      if (typeof window.showGiga !== 'function') {
        statusEl.innerText = "SDK not loaded yet. Check AdBlocker.";
        statusEl.className = "text-red-400";
        return;
      }

      statusEl.innerText = "Loading Ad...";
      statusEl.style.color = "#60a5fa"; // Blue

      // বাটনে ক্লিক করলে ২ সেকেন্ড পর অটোমেটিক কাউন্ট হয়ে যাবে
      setTimeout(() => {
        adCount++;
        updateUI();
        statusEl.innerText = "Ad Counted!";
        statusEl.style.color = "#4ade80"; // Green
      }, 2000);

      // Gigapub SDK কল
      try {
        window.showGiga().catch(e => {
          console.error("Ad failed or closed:", e);
        });
      } catch (error) {
        console.error("Ad Calling Error:", error);
      }
    }

    document.getElementById('watchBtn').onclick = showTgAd;

    // SDK Check Logic
    function startSdkCheck() {
      sdkCheckCount = 0;
      clearInterval(checkSDKInterval);
      
      checkSDKInterval = setInterval(() => {
        if (typeof window.showGiga === 'function') {
          statusEl.innerText = "Ready";
          statusEl.style.color = "#4ade80"; // Green
          clearInterval(checkSDKInterval);
        } else {
          sdkCheckCount++;
          if (sdkCheckCount > 80) { // ৮ সেকেন্ড 
            statusEl.innerText = "SDK Blocked / Check AdBlocker";
            statusEl.className = "text-red-400";
          }
        }
      }, 100);
    }

    // Initialize Application
    updateUI();
    startSdkCheck();
  </script>
</body>
</html>
